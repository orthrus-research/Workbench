[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-relay"
version = "0.1.1"
description = "Workbench relay module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.0,<0.2.0", "workbench-runtime-explorer>=0.1.0,<0.2.0"]

[project.entry-points."workbench.modules"]
"relay" = "workbench_registration_relay:module"

[tool.setuptools]
packages = ["workbench_relay", "workbench_resources.modules.relay"]
py-modules = ["workbench_registration_relay"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.relay" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.relay" = ["pyproject.toml", "README.md", "contracts/**/*", "src/**/*.py"]

[tool.workbench]
module-id = "relay"
requires = ["runtime-explorer"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-pack-program-studio"
version = "0.1.2"
description = "Workbench pack-program-studio module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.1,<0.2.0", "workbench-material-semantics>=0.1.1,<0.2.0", "workbench-project-intelligence>=0.1.0,<0.2.0"]

[project.entry-points."workbench.modules"]
"pack-program-studio" = "workbench_registration_pack_program_studio:module"

[tool.setuptools]
packages = ["workbench_pack_program_studio", "workbench_resources.modules.pack-program-studio"]
py-modules = ["workbench_registration_pack_program_studio"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.pack-program-studio" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.pack-program-studio" = ["pyproject.toml", "README.md", "schemas/**/*", "src/**/*.py"]

[tool.workbench]
module-id = "pack-program-studio"
requires = ["material-semantics", "project-intelligence"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-shell"
version = "0.1.6"
description = "Workbench workbench-shell module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.3,<0.2.0", "PyYAML==6.0.3", "jsonschema==4.19.2", "referencing==0.36.2", "workbench-atlas>=0.1.5,<0.2.0", "workbench-crucible>=0.1.3,<0.2.0", "workbench-pack-program-studio>=0.1.1,<0.2.0", "workbench-project-intelligence>=0.1.1,<0.2.0", "workbench-runtime-explorer>=0.1.0,<0.2.0", "workbench-core>=0.1.9,<0.2.0"]

[project.optional-dependencies]
construction = ["workbench-blueprints>=0.1.1,<0.2.0"]
material-checks = ["workbench-axiom>=0.1.0,<0.2.0"]

[project.entry-points."workbench.modules"]
"workbench-shell" = "workbench_registration_workbench_shell:module"

[tool.setuptools]
packages = ["workbench_shell", "workbench_resources.modules.workbench-shell"]
py-modules = ["workbench_registration_workbench_shell"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.workbench-shell" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.workbench-shell" = ["pyproject.toml", "README.md", "contracts/**/*", "data/**/*", "schemas/**/*", "src/**/*.py"]

[tool.workbench]
module-id = "workbench-shell"
requires = ["atlas", "crucible", "pack-program-studio", "project-intelligence", "runtime-explorer"]
optional-requires = ["blueprints", "axiom"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-worldgen-qualifier"
version = "0.1.0"
description = "Workbench worldgen-qualifier module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.0,<0.2.0", "workbench-crucible>=0.1.0,<0.2.0", "workbench-worldgen-cockpit>=0.1.0,<0.2.0"]

[project.entry-points."workbench.modules"]
"worldgen-qualifier" = "workbench_registration_worldgen_qualifier:module"

[tool.setuptools]
packages = ["workbench_worldgen_qualifier", "workbench_resources.modules.worldgen-qualifier"]
py-modules = ["workbench_registration_worldgen_qualifier"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.worldgen-qualifier" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.worldgen-qualifier" = ["pyproject.toml", "README.md", "src/**/*.py"]

[tool.workbench]
module-id = "worldgen-qualifier"
requires = ["crucible", "worldgen-cockpit"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

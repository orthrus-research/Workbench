[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-atlas"
version = "0.1.5"
description = "Workbench atlas module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.1,<0.2.0", "workbench-core>=0.1.8,<0.2.0", "jsonschema==4.19.2", "workbench-crucible>=0.1.3,<0.2.0"]

[project.entry-points."workbench.modules"]
"atlas" = "workbench_registration_atlas:module"

[tool.setuptools]
packages = ["workbench_atlas_categorical_graph", "workbench_atlas_projection", "workbench_atlas_recipe_health", "workbench_atlas_observations", "workbench_atlas", "workbench_atlas_worldgen", "workbench_resources.modules.atlas"]
py-modules = ["workbench_registration_atlas"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.atlas" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.atlas" = ["pyproject.toml", "README.md", "contracts/**/*", "data/**/*", "schemas/**/*", "src/**/*.py", "tools/**/*.py"]

[tool.workbench]
module-id = "atlas"
requires = ["crucible"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

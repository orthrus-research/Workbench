[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-worldgen-cockpit"
version = "0.1.2"
description = "Workbench worldgen-cockpit module"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.0,<0.2.0", "workbench-atlas>=0.1.0,<0.2.0", "workbench-crucible>=0.1.0,<0.2.0", "workbench-subsurface-studio>=0.1.0,<0.2.0"]

[project.entry-points."workbench.modules"]
"worldgen-cockpit" = "workbench_registration_worldgen_cockpit:module"

[tool.setuptools]
packages = ["workbench_worldgen_cockpit", "workbench_resources.modules.worldgen-cockpit"]
py-modules = ["workbench_registration_worldgen_cockpit"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.modules.worldgen-cockpit" = "."

[tool.setuptools.package-data]
"workbench_resources.modules.worldgen-cockpit" = ["pyproject.toml", "README.md", "src/**/*.py"]

[tool.workbench]
module-id = "worldgen-cockpit"
requires = ["atlas", "crucible", "subsurface-studio"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.egg-info/*", "**/node_modules/*", "**/.gradle/*", "**/build/*"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
name = "workbench-profile-cleanroom"
version = "0.1.1"
description = "Explicit cleanroom profile adapters and owned resources"
requires-python = ">=3.12,<3.15"
dependencies = ["workbench-api>=0.1.0,<0.2.0", "workbench-project-intelligence>=0.1.0,<0.2.0", "jsonschema==4.19.2"]

[project.optional-dependencies]
construction = ["workbench-blueprints>=0.1.1,<0.2.0"]

[project.entry-points."workbench.check_platforms"]
cleanroom = "workbench_profile_cleanroom.developer_checks"

[project.entry-points."workbench.profiles"]
cleanroom = "workbench_profile_cleanroom:profile"

[project.entry-points."workbench.axiom_targets"]
cleanroom = "workbench_profile_cleanroom.axiom"

[project.entry-points."workbench.workspace_home_fixtures"]
cleanroom = "workbench_profile_cleanroom.fixture_home"

[project.entry-points."workbench.cleanroom_fixture_builds"]
cleanroom = "workbench_profile_cleanroom.fixture_build"

[tool.setuptools]
packages = ["workbench_cleanroom_mixin_doctor", "workbench_cleanroom_new_project", "workbench_profile_cleanroom", "workbench_resources.profiles.platforms.cleanroom"]

[tool.setuptools.package-dir]
"" = "src"
"workbench_resources.profiles.platforms.cleanroom" = "."


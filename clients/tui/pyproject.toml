[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-tui"
version = "0.0.1"
description = "Experimental Textual client for Workbench"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["textual==8.2.8", "textual-fspicker==1.0.1"]

[project.optional-dependencies]
dev = ["textual-dev==1.8.0"]

[project.scripts]
workbench-tui = "workbench_tui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["workbench_tui"]

[tool.setuptools.package-data]
workbench_tui = ["*.tcss"]

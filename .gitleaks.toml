title = "Workbench public-history secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

# This is the public TrackAPI 1.2 JAR checksum, also pinned in the
# Supersymmetry profile's axiom-native-inputs.json, not an API credential.
# Match both this exact test path and this exact digest; retain every rule.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "TrackAPI 1.2 public artifact SHA-256 in original-artifact assertions"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)modules/axiom/jvm/src/test/java/research/orthrus/axiom/materialhost/NativePackEarlyArtifactTest\.java$''']
regexes = ['''^5fd930eb6afb769f3c806a5356fb09f842fd6679a5a04c53d3be934152c482bc$''']
